name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write

    steps:
      - name: Setup pnpm + Turborepo 🏗
        uses: cerberauth/ci/actions/pnpm-turbo-setup@main
        with:
          fetch-depth: 0
          registry-url: https://registry.npmjs.org

      - name: Build packages
        run: pnpm turbo run build
        env:
          TURBO_TELEMETRY_DISABLED: 1

      - name: Create release PR or publish to npm 📦
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Setup node env for GitHub Packages 🏗
        if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@cerberauth"

      - name: Publish to GitHub Packages 📦
        if: steps.changesets.outputs.published == 'true'
        run: |
          for name in $(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[].name'); do
            pnpm --filter "$name" publish --no-git-checks --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
